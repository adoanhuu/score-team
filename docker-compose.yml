services:
  app:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env.local
    ports:
      - "8788:8788"
    command: >
      sh -lc "test -d .output/public || npm run generate;
      npx wrangler@4.124.0 pages dev .output/public --ip 0.0.0.0 --port 8788 --d1 DB=$$D1_DATABASE_ID"
